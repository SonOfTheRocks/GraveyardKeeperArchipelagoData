name: Validate shared data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python validate_data.py
      - run: python -m unittest discover -s tests -t .
      - name: Require a data version bump for runtime data changes
        if: github.event_name == 'pull_request'
        run: python check_data_version.py "origin/${{ github.base_ref }}"
